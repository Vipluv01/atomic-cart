name: Uptime Ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping-health-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        run: |
          URL="https://atomic-cart-ashen.vercel.app/api/health"
          RESPONSE=$(curl -s -w "\n%{http_code}" "$URL")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_STATUS"
          echo "Body: $BODY"

          # The endpoint reports three tiers, not a flat "ok": "healthy" and
          # "degraded" both return 200 (a "degraded" S3-only issue doesn't
          # block a single customer from buying anything), only "unhealthy"
          # (DB or Stripe actually down -- the real purchase path is broken)
          # returns 503. Alerting on HTTP status alone is the correct
          # signal here, not string-matching a status field that would
          # require this workflow and the endpoint to agree on a shape
          # neither was actually specified to use.
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Health check failed with HTTP $HTTP_STATUS -- $BODY"
            exit 1
          fi

          echo "Health check passed."
